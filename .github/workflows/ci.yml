name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Manifests are valid JSON
        run: |
          python -c "import json; d=json.load(open('.claude-plugin/plugin.json', encoding='utf-8')); assert d['name']=='seo-content-worker'"
          python -c "import json; json.load(open('.claude-plugin/marketplace.json', encoding='utf-8'))"
          python -c "import json; json.load(open('hooks/hooks.json', encoding='utf-8'))"

      - name: Plugin structure (skills / agents / commands / procedures)
        run: |
          set -e
          for f in skills/*/SKILL.md; do
            d=$(basename "$(dirname "$f")"); n=$(grep -m1 '^name:' "$f" | sed 's/name: *//')
            [ "$d" = "$n" ] || { echo "skill name mismatch: $d vs $n"; exit 1; }
          done
          for a in serp-collector article-analyzer unit-drafter diagram-maker fact-checker keyword-gate pre-publish-verifier fix-integrator adversarial-reviewer; do
            [ -f "agents/$a.md" ] || { echo "missing agent $a"; exit 1; }
            grep -q "^name: $a$" "agents/$a.md" || { echo "agent name mismatch $a"; exit 1; }
          done
          for p in seo-start seo-article seo-serps seo-analysis seo-outline seo-write seo-setup seo-verify; do
            [ -f "procedures/$p.md" ] || { echo "missing procedure $p"; exit 1; }
          done
          [ "$(ls commands/*.md | wc -l)" -ge 7 ] || { echo "commands < 7"; exit 1; }
          # Subagent Guard のロスターと agents/ が一致
          roster=$(grep -o "ROSTER='[^']*'" hooks/scripts/subagent-guard.sh | sed "s/ROSTER='//;s/'//" | tr '|' '\n' | sort)
          agents=$(ls agents/*.md | xargs -n1 basename | sed 's/\.md$//' | sort)
          diff <(echo "$roster") <(echo "$agents") || { echo "subagent-guard roster != agents/"; exit 1; }

      - name: Python scripts compile
        run: python -m py_compile scripts/seo-db.py scripts/wp-draft.py scripts/keyword-gate.py

      - name: Hooks smoke test
        run: bash scripts/test-hooks.sh

      - name: keyword-gate selftest
        run: python scripts/keyword-gate.py --selftest

      - name: SQLite schema + knowledge search
        env:
          SEO_DB: /tmp/seo.db
        run: |
          python scripts/seo-db.py init
          python scripts/seo-db.py stats
          cat > /tmp/k.json <<'EOF'
          [{"kind":"claim","theme":"テスト","stance":"neutral","title":"テスト項目","meta_description":"CI 用のダミー知識。検索で見つかること。","body":"本文","dated":"2026-09"}]
          EOF
          python scripts/seo-db.py knowledge add --json /tmp/k.json
          python scripts/seo-db.py knowledge search --q "ダミー" | grep -q '"id": 1'

      - name: wp-draft refuses publish
        run: |
          set +e
          out=$(python scripts/wp-draft.py --site https://example.invalid --title t --content README.md --status publish); rc=$?
          set -e
          echo "$out"; [ "$rc" -eq 1 ] && echo "$out" | grep -q '許可されていません'
