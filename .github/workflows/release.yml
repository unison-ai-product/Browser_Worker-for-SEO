name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: verify.sh --release
        env:
          TAG: ${{ github.ref_name }}
        run: bash scripts/verify.sh --release

      - name: Build .plugin
        run: |
          python - <<'PY'
          import zipfile, pathlib, json
          v = json.load(open('.claude-plugin/plugin.json', encoding='utf-8'))['version']
          out = pathlib.Path(f"seo-content-worker-{v}.plugin")
          skip = {".git", ".github", "__pycache__", "memory", "knowledge", "outputs", ".claude"}
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as z:
              for p in pathlib.Path(".").rglob("*"):
                  if any(part in skip for part in p.parts) or p.is_dir() or p.suffix in (".pyc", ".plugin") or p.name == ".env": continue
                  z.write(p, p.as_posix())
          print(out, out.stat().st_size)
          PY

      - name: Release notes from CHANGELOG
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '/^## \[/{p = ($0 ~ "^## \\[" v "\\]")} p' CHANGELOG.md | tail -n +2 > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md" > notes.md
          cat notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" seo-content-worker-*.plugin \
            --title "seo-content-worker ${GITHUB_REF_NAME}" \
            --notes-file notes.md
