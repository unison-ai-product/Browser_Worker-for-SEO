<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>figure</title>
<style>
  /* 図解の雛形（diagram-maker 経路 A）。幅 800px 固定。配色トークンは media-rules に指定があれば差し替える */
  :root { --ink:#1f2937; --muted:#6b7280; --base:#2563eb; --accent:#f59e0b; --line:#d1d5db; --bg:#ffffff; }
  html,body { margin:0; background:var(--bg); }
  #figure { width:800px; padding:24px; box-sizing:border-box; font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif; color:var(--ink); font-size:16px; line-height:1.5; }
  h1 { font-size:20px; margin:0 0 16px; }
  .flow { display:flex; align-items:center; gap:8px; }
  .box { flex:1; border:2px solid var(--base); border-radius:8px; padding:12px; text-align:center; min-height:64px; display:flex; align-items:center; justify-content:center; }
  .box.accent { border-color:var(--accent); background:#fff7ed; }
  .arrow { font-size:24px; color:var(--muted); }
  table { border-collapse:collapse; width:100%; }
  th,td { border:1px solid var(--line); padding:8px 10px; text-align:left; }
  th { background:#f3f4f6; }
  .caption { margin-top:12px; font-size:13px; color:var(--muted); }
</style>
</head>
<body>
<div id="figure">
  <h1>（図の見出し 20 字以内）</h1>
  <!-- 流れ図の例。比較なら <table>、構造なら .box を格子に並べる。要素 7 以下・各 40 字以内 -->
  <div class="flow">
    <div class="box">ステップ 1</div><div class="arrow">→</div>
    <div class="box">ステップ 2</div><div class="arrow">→</div>
    <div class="box accent">ステップ 3</div>
  </div>
  <div class="caption">出典: （数値を含む図は必須。模式図は「模式図（当社作成）」）</div>
</div>
</body>
</html>
