# site-profile.yaml の記入例（/SEO設定 が knowledge/config/site-profile.yaml として作る）
# ここはプラグイン同梱の「例」。値は SEO内部指示.xlsx / 初心者向け設計フォーマット.xlsx（転職メディア）から転記。
# 他サイトでは personas / funnels / categories / topics / outline / cta をそのサイトの言葉に置き換える。
# 未定義の項目はスキルが「未定義」と扱い、AI が推測で埋めることはしない。

site:
  name: "（サイト名）"
  domain: "example.jp"          # site:検索と内部リンク判定に使う自社ドメイン
  media_type: "転職メディア"     # 例

# 想定検索者（seo-analysis §1-3）
personas:
  - { name: 未経験,     detail: 職種として興味がある }
  - { name: 初学者,     detail: 実際に勉強までしている }
  - { name: 微経験,     detail: 実務経験が3年未満 }
  - { name: 経験者,     detail: 実務経験が3年以上 }
  - { name: 採用担当者, detail: エンジニア採用を検討中 }
  - { name: 新卒,       detail: 就活で情報収集をしている }

# ファネル（seo-analysis §1-4 / content-marketing §1-1）。順序 = フェーズの進む方向
funnels:
  未経験:
    - { stage: 興味・関心,       detail: エンジニアに興味がある段階,               keywords: [とは, 仕事内容, 将来性, 年収] }
    - { stage: 情報収集,         detail: エンジニアになる根拠を探している状態,     keywords: [職種, 向き・不向き, スキル, 働き方, 違い] }
    - { stage: 理解・検討,       detail: エンジニアになるリスクを払拭する状態,     keywords: [やめとけ, やばい, オワコン, 難しい] }
    - { stage: 登録・相談,       detail: プロに相談を考えている状態,               keywords: [転職, おすすめ, 未経験, エージェント, 求人, なるには] }
    - { stage: 勉強・転職活動中, detail: エンジニアになることを決意して行動している状態, keywords: [資格, 独学, 言語, 本, 勉強, 面接] }
  経験者:
    - { stage: 不満・関心,       detail: 現職に不満・キャリアアップに興味がある段階, keywords: [辞めたい, 脱出, やばい, きつい, 転職失敗, ブラック, 成長] }
    - { stage: 情報収集,         detail: 現職の不満や方法の回答を探している状態 }
    - { stage: 自己診断,         detail: 情報収集を経て自分の状況を整理する状態,   keywords: [年収アップ, キャリアアップ, キャリアパス, スキルアップ, 〇年目, 転職理由] }
    - { stage: 登録・相談,       detail: プロに相談を考えている状態,               keywords: [求人, エージェント, 企業] }
    - { stage: 応募・転職活動中, detail: エンジニア転職を決意して行動している状態, keywords: [面接対策, ポートフォリオ, スキルシート] }

# カテゴリ木（content-marketing §1-3）。左 → 右で CV しやすくなる順
categories:
  order: [入門, 選択, 転職のための選択, 育てて刈り取る]
  tree:
    入門:
      エンジニア: [エンジニア職業ガイド, エンジニア職業ゴシップ, エンジニア転職ガイド]
      インフラエンジニア: [インフラ職業ガイド, インフラ職業ゴシップ, インフラ転職ガイド]
      開発エンジニア: [開発職業ガイド, 開発職業ゴシップ, 開発転職ガイド]
      システムエンジニア: [SE職業ガイド, SE職業ゴシップ, SE転職ガイド]
      プログラマー: [PG職業ガイド, PG職業ゴシップ, PG転職ガイド]
    選択:
      開発エンジニア職種: [フロントエンドエンジニア, バックエンドエンジニア, サーバーサイドエンジニア, アプリケーションエンジニア, Webエンジニア, 組み込みエンジニア, テスター, QAエンジニア]
      インフラエンジニア職種: [ネットワークエンジニア, サーバーエンジニア, データベースエンジニア, セキュリティエンジニア, クラウドエンジニア]
    転職のための選択:
      IT企業: [SES, SIer, 自社開発]
      その他エンジニア: [社内SE, ITヘルプデスク, セールスエンジニア]
      プロジェクト管理: [プロジェクトマネージャー, プロジェクトリーダー, プロジェクトマネジメントオフィサー, ブリッジSE, ITコンサルタント]
    育てて刈り取る:
      民間インフラ資格: [Cisco技術者認定資格, Linux技術者認定資格, AWS認定資格, Microsoft Azure認定資格, Google Cloud 認定資格, CompTIA認定資格, ITIL認定資格, OSS-DB認定資格, Oracle認定資格, (ISC)²認定資格, CISA認定資格, SANS認定資格]
      民間開発資格: [Java資格, Ruby資格, PHP資格, C言語資格, Python資格, HTML資格, アプリケーション技術者認定試験, Swift資格, テスト資格]
      情報処理技術者試験（国家）: [ITパスポート, 情報セキュリティマネジメント試験, 基本情報技術者試験, 応用情報技術者試験, ITストラテジスト試験, システムアーキテクト試験, プロジェクトマネージャ試験, ネットワークスペシャリスト, データベーススペシャリスト, エンベデッドシステムスペシャリスト, ITサービスマネージャ試験, システム監査技術者試験, 情報処理安全確保支援士試験]

# トピック（content-marketing §5）
topics:
  仕事内容: { 下流工程: [監視, 運用, 保守], 上流工程: [設計, 構築, 要件定義] }
  スキル:   { 資格: [CCNA, Java Gold], 言語: [Python, Java], 勉強・独学: [本, サイト], ツール・OS: [Git, Linux] }
  将来性・需要: [人手不足, AI, 人口]
  年収・給料: { 年収: [20代, 30代, 未経験, 1000万] }
  働き方: [夜勤, 服装, リモートワーク]
  職種・種類: { エンジニア 種類: [ネットワークエンジニア, フロントエンドエンジニア] }
  やめとけ: [辛い, 大変, しんどい, やばい]
  辞めたい: [ついていけない, 挫折, 闇]
  おすすめ: [やりがい, 魅力, 面白さ, かっこいい]

# 構成案の固定要素（seo-outline §3）。定義が無ければ入れない
outline:
  lead_link: true                     # リード文下「事前に読みたい」（上位概念の記事へ）を入れる
  service_h2:                         # 最終 H2（サービス訴求）。null なら入れない
    title: "{keyword}の転職はユニゾンキャリア"
    h3: [ユニゾンキャリアのサービス特徴, ユニゾンキャリアの転職成功事例]

# CTA（content-marketing §4）
cta:
  h2_end: "CTA"                       # H2 末尾に置く CTA の種別名（WP のブロック名等は media-rules に）
  h3_inner: "CTAボタンまたはバナー"
  text_link: "こちらをクリック ▶ 【エンジニア転職のプロに無料相談】"
  url: "https://example.jp/lp/"
